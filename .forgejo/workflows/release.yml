name: Release

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update (increment pkgrel even if version is same)'
        required: false
        default: 'false'
        type: boolean

jobs:
  publish:
    runs-on: [codeberg-medium]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Version
        id: version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/CaptainSP/animecix-desktop-2/releases/latest | jq -r .tag_name | sed 's/v//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check Version
        id: check
        env:
          FORCE: ${{ github.event.inputs.force_update == 'true' && 'true' || 'false' }}
        run: |
          AUR_VER=$(curl -s https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=animecix-desktop | grep "^pkgver=" | cut -d= -f2)
          NEW_VER=${{ steps.version.outputs.version }}
          
          if [[ "$AUR_VER" != "$NEW_VER" || "$FORCE" == "true" ]]; then
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
            echo "Update needed: AUR=$AUR_VER, New=$NEW_VER, Force=$FORCE"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          fi

      - name: Update AUR Package
        if: steps.check.outputs.update_needed == 'true'
        uses: docker://archlinux:latest
        env:
          EMAIL: ${{ secrets.EMAIL }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          AUR_REPO: "animecix-desktop"
          FORCE_UPDATE: ${{ github.event.inputs.force_update == 'true' && 'true' || 'false' }}
        with:
          entrypoint: bash
          args: ${{ github.workspace }}/scripts/aur.sh